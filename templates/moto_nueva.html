{% extends "base.html" %}

{% block titulo %}Nueva moto{% endblock %}

{% block contenido %}
    <h1>Nueva moto</h1>

    <form method="POST" action="{{ url_for('nuevamoto') }}">
        <p><input type="text" name="marca" placeholder="Marca" value="{{ datos.get('marca', '') }}" required></p>
        <p><input type="text" name="modelo" placeholder="Modelo" value="{{ datos.get('modelo', '') }}" required></p>
        <p><input type="text" name="patente" placeholder="Patente" value="{{ datos.get('patente', '') }}" required></p>

        <p>
            <select name="idcliente" required>
                <option value="">Seleccioná un cliente</option>
                {% for c in clientes %}
                <option value="{{ c.idcliente }}" {% if datos.get("idcliente")|string == c.idcliente|string %}selected{% endif %}>
                    {{ c.apellido }}, {{ c.nombre }}
                </option>
                {% endfor %}
            </select>
        </p>

        <button type="submit">Guardar</button>
        <a href="{{ url_for('listarmotos') }}">Cancelar</a>
    </form>
{% endblock %}
