{% extends "base.html" %}

{% block titulo %}Editar moto{% endblock %}

{% block contenido %}
    <h1>Editar moto</h1>

    <form method="POST" action="{{ url_for('editarmoto', idmoto=moto.idmoto) }}">
        <p><input type="text" name="marca" placeholder="Marca" value="{{ moto.marca }}" required></p>
        <p><input type="text" name="modelo" placeholder="Modelo" value="{{ moto.modelo }}" required></p>
        <p><input type="text" name="patente" placeholder="Patente" value="{{ moto.patente }}" required></p>

        <p>
            <select name="idcliente" required>
                <option value="">Seleccioná un cliente</option>
                {% for c in clientes %}
                <option value="{{ c.idcliente }}" {% if moto.idcliente|string == c.idcliente|string %}selected{% endif %}>
                    {{ c.apellido }}, {{ c.nombre }}
                </option>
                {% endfor %}
            </select>
        </p>

        <button type="submit">Guardar cambios</button>
        <a href="{{ url_for('listarmotos') }}">Cancelar</a>
    </form>
{% endblock %}
